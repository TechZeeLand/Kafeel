server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    client_max_body_size 12m;

    # Friendly 404 page (route missing files to a custom error page)
    error_page 404 /404.php;

    # Never serve PHP source or config from the internal includes folder
    location /includes/ {
        deny all;
    }

    # Uploaded product photos: served as static files, PHP execution disabled
    location /uploads/ {
        location ~ \.php$ {
            deny all;
        }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    # Deny dotfiles (.env, .git, etc.) if ever present under the docroot
    location ~ /\. {
        deny all;
    }
}
